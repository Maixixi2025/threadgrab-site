<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThreadGrab - Redirecting...</title>

  <script>
    (function() {
      var COOKIE = 'tg_lang';
      var STORE_KEY = 'threadgrab_lang';
      var API_URL = 'https://ipapi.co/json/';

      // Language path map
      var LANG_MAP = { id: '/id/', pt: '/pt/', en: '/en/' };

      // Country code → language
      var COUNTRY_MAP = {
        // Indonesian
        ID: 'id',
        // Portuguese
        PT: 'pt', BR: 'pt', AO: 'pt', MZ: 'pt', CV: 'pt', GW: 'pt', ST: 'pt', TL: 'pt',
      };

      function getLang() {
        // 1. Stored preference (localStorage)
        var stored = localStorage.getItem(STORE_KEY);
        if (stored && ['en','id','pt'].includes(stored)) return stored;

        // 2. IP-based country (fetch async, redirect once resolved)
        fetch(API_URL)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var country = data && data.country_code;
            var lang = (country && COUNTRY_MAP[country]) || 'en';
            localStorage.setItem(STORE_KEY, lang);
            var path = LANG_MAP[lang] || '/en/';
            window.location.replace(path);
          })
          .catch(function() {
            // Fallback to English on error
            window.location.replace('/en/');
          });

        return null; // no sync redirect
      }

      // Check stored preference first — if set, redirect immediately (no delay)
      var stored = localStorage.getItem(STORE_KEY);
      if (stored && ['en','id','pt'].includes(stored)) {
        window.location.replace(LANG_MAP[stored] || '/en/');
        return;
      }

      // No stored pref — use IP detection
      getLang();
    })();
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      flex-direction: column;
      gap: 14px;
    }
    .logo { font-size: 1.5rem; font-weight: 700; }
    .logo span { color: #20d5ec; }
    p { color: #666; font-size: 0.9rem; margin: 0; }
    .langs { display: flex; gap: 10px; }
    .langs a {
      color: #20d5ec;
      text-decoration: none;
      font-size: 0.82rem;
      padding: 5px 14px;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .langs a:hover { background: #1a1a1a; }
  </style>
</head>
<body>
  <div class="logo">Thread<span>Grab</span></div>
  <p>Detecting your location...</p>
  <div class="langs">
    <a href="/en/">English</a>
    <a href="/id/">Bahasa Indonesia</a>
    <a href="/pt/">Português</a>
  </div>
</body>
</html>
