<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThreadGrab - Download Video Threads Gratis</title>
  <meta name="description" content="Download video Threads secara gratis, tanpa install aplikasi. Mendukung semua postingan dan profil publik Threads.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 20px 24px; display: flex; align-items: center; gap: 10px; }
    .logo { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .logo span { color: #20d5ec; }
    .lang-bar { margin-left: auto; display: flex; gap: 6px; }
    .lang-bar a { color: #888; text-decoration: none; font-size: 0.85rem; padding: 4px 8px; border-radius: 4px; transition: all 0.2s; }
    .lang-bar a:hover, .lang-bar a.active { color: #fff; background: #222; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); margin-bottom: 10px; line-height: 1.2; }
    h1 span { color: #20d5ec; }
    .subtitle { color: #888; font-size: 1.05rem; margin-bottom: 40px; max-width: 500px; }
    .search-box { width: 100%; max-width: 580px; position: relative; margin-bottom: 16px; }
    .search-box input { width: 100%; padding: 16px 20px; padding-right: 120px; font-size: 1rem; border-radius: 12px; border: 2px solid #222; background: #1a1a1a; color: #fff; outline: none; transition: border-color 0.2s; }
    .search-box input:focus { border-color: #20d5ec; }
    .search-box input::placeholder { color: #555; }
    .search-box button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 10px 22px; background: #20d5ec; color: #000; font-weight: 600; font-size: 0.95rem; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .search-box button:hover { background: #1bc4d4; }
    .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { color: #555; font-size: 0.8rem; margin-bottom: 30px; }
    .result-area { width: 100%; max-width: 580px; text-align: left; }
    .result-card { background: #1a1a1a; border-radius: 12px; padding: 20px; margin-bottom: 12px; display: none; }
    .result-card.show { display: block; }
    .result-card .username { color: #20d5ec; font-weight: 600; margin-bottom: 8px; }
    .result-card .bio { color: #aaa; font-size: 0.9rem; margin-bottom: 16px; }
    .result-card .stats { display: flex; gap: 20px; margin-bottom: 16px; }
    .result-card .stat { text-align: center; }
    .result-card .stat .num { font-size: 1.2rem; font-weight: 700; }
    .result-card .stat .label { color: #666; font-size: 0.75rem; }
    .result-card video, .result-card img { width: 100%; border-radius: 8px; margin-bottom: 12px; max-height: 400px; object-fit: contain; background: #000; }
    .download-btn { display: inline-block; width: 100%; padding: 12px; background: #20d5ec; color: #000; text-align: center; text-decoration: none; font-weight: 600; border-radius: 8px; margin-top: 8px; transition: background 0.2s; }
    .download-btn:hover { background: #1bc4d4; }
    .error-msg { color: #ff5757; font-size: 0.9rem; margin-top: 10px; display: none; }
    .error-msg.show { display: block; }
    .loader { border: 3px solid #222; border-top-color: #20d5ec; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; margin: 30px auto; display: none; }
    .loader.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; padding: 24px; color: #444; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Thread<span>Grab</span></div>
    <div class="lang-bar">
      <a href="/en/">EN</a>
      <a href="/id/" class="active">ID</a>
      <a href="/pt/">PT</a>
    </div>
  </header>

  <main>
    <h1>Download Video <span>Threads</span> Gratis</h1>
    <p class="subtitle">Tempel URL Threads apa saja — kami ambil video atau info profil secara gratis, tanpa install aplikasi.</p>

    <div class="search-box">
      <input type="text" id="urlInput" placeholder="Tempel URL Threads atau @username..." autocomplete="off">
      <button id="goBtn" onclick="handle()">Unduh</button>
    </div>
    <p class="hint">Mendukung postingan &amp; profil publik · threads.net/@username atau threads.net/p/xxx</p>

    <div class="loader" id="loader"></div>
    <p class="error-msg" id="errorMsg"></p>

    <div class="result-area">
      <div class="result-card" id="resultCard"></div>
    </div>
  </main>

  <footer>© 2026 ThreadGrab · Tanpa watermark · Gratis selamanya</footer>

  <script>
    const API = 'https://threadgrab-worker.maijasonx.workers.dev';

    async function handle() {
      const input = document.getElementById('urlInput').value.trim();
      const btn = document.getElementById('goBtn');
      const loader = document.getElementById('loader');
      const errEl = document.getElementById('errorMsg');
      const card = document.getElementById('resultCard');

      if (!input) { showErr('Masukkan URL Threads atau username'); return; }
      errEl.classList.remove('show');
      card.classList.remove('show');
      loader.classList.add('show');
      btn.disabled = true;

      try {
        let username = input;
        const urlMatch = input.match(/threads\.net\/(?:@|p\/)([^\/\?]+)/);
        if (urlMatch) username = '@' + urlMatch[1];
        if (!username.startsWith('@')) username = '@' + username;

        const res = await fetch(API + '/user/infobyusername', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        const data = await res.json();

        loader.classList.remove('show');
        btn.disabled = false;

        if (data.error || !data.data?.user) {
          showErr(data.message || 'User tidak ditemukan. Periksa username dan coba lagi.');
          return;
        }

        render(data.data.user);
      } catch(e) {
        loader.classList.remove('show');
        btn.disabled = false;
        showErr('Kesalahan koneksi. Silakan coba lagi.');
      }
    }

    function render(user) {
      const card = document.getElementById('resultCard');
      const followers = user.follower_count ? user.follower_count.toLocaleString() : 'N/A';
      const bio = user.text_app_biography?.text_fragments?.fragments?.map(f => f.plaintext).join('') || user.biography || '';
      const avatar = user.profile_pic_url || '';
      const verified = user.is_verified ? '✓' : '';

      card.innerHTML = `
        <div class="username">@${user.username} ${verified ? '✓' : ''}</div>
        <div class="bio">${bio || 'Tidak ada bio'}</div>
        <div class="stats">
          <div class="stat"><div class="num">${followers}</div><div class="label">Pengikut</div></div>
        </div>
        ${avatar ? `<img src="${avatar}" alt="Avatar">` : ''}
        <a class="download-btn" href="https://threads.net/@${user.username}" target="_blank">Buka di Threads →</a>
      `;
      card.classList.add('show');
    }

    function showErr(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
    }

    document.getElementById('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') handle(); });
  </script>
</body>
</html>
